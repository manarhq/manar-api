# Gitleaks configuration for manar-api (Phase 12b: CI security scanning).
#
# Extends gitleaks's own default detection rule set (no rules redefined
# here — only an allowlist on top of it). See docs/kubernetes.md and
# .gitlab-ci.yml's `gitleaks` job for how this is wired into CI.
title = "manar-api gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Triaged false positives — confirmed non-secrets, not redacted history"

# One-time full-history scan run 2026-08-19 (Phase 12b) found exactly one
# finding: NestJS's own default `nest new` README.md boilerplate — a
# CircleCI badge URL pointing at the *upstream* nestjs/nest GitHub repo
# with its own well-known placeholder token ("abc123def456", the literal
# sample value NestJS ships in every freshly generated project's
# README.md, not a value ever issued to or usable against this repo or
# any real CircleCI project). Never edited since Phase 1. Triaged as a
# confirmed false positive, not a real secret — allowlisted by fingerprint
# rather than deleted from history (deleting would rewrite published
# history for a non-issue).
regexTarget = "match"
paths = [
  '''^README\.md$''',
]
regexes = [
  '''nestjs/nest/master\?token=abc123def456''',
]

# Triaged 2026-10-09 (25 findings once the job scans the full history): synthetic fixtures
# the DLP floor, DLP classification, credential broker, LLM proxy, assistant and JWT guard
# specs feed to the detectors and redaction (sample JWTs, Azure connection-string keys,
# placeholder PEM headers, keyboard-pattern client secrets, fake Keycloak subjects). None was
# ever issued, so nothing to rotate. Scoped to spec files and the four rules they trip.
# ponytail: path scope, so a real secret pasted into a spec under these four rules would pass;
# CI fixtures come from env or fakes, never real credentials.
[[allowlists]]
description = "Synthetic detector fixtures in unit and e2e specs"
targetRules = ["azure-ad-client-secret", "generic-api-key", "private-key", "jwt"]
paths = ['''\.spec\.ts$''', '''\.e2e-spec\.ts$''']

# docs/kubernetes.md quotes the README badge URL triaged above (NestJS's sample token).
[[allowlists]]
description = "docs/kubernetes.md quoting the NestJS sample badge token"
regexTarget = "match"
paths = ['''^docs/kubernetes\.md$''']
regexes = ['''token=abc123def456''']
condition = "AND"
