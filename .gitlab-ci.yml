stages:
  - lint
  - typecheck
  - test
  - build
  - security
  - deploy

include:
  - local: deploy/ci/fleet-deploy.gitlab-ci.yml

# The ordinary jobs never run in a manar-fleet deploy pipeline (FLEET_MODE set).
.ci-rules:
  rules:
    - if: $FLEET_MODE
      when: never
    # Same as before rules existed: branch pipelines only, no duplicate merge request pipelines.
    - if: $CI_PIPELINE_SOURCE != "merge_request_event"

variables:
  PNPM_HOME: '$CI_PROJECT_DIR/.pnpm'

# Install pnpm via Corepack (bundled with Node) instead of piping the
# get.pnpm.io install script into a shell: Corepack fetches the exact
# version pinned in package.json's "packageManager" field from the npm
# registry, which verifies package integrity - no unpinned remote script
# execution.
default:
  tags: [manar]
  image: node:24.14.1
  before_script:
    - export PATH="$PNPM_HOME/bin:$PATH"
    - corepack enable
    - corepack prepare --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
    # Workspace packages resolve through their gitignored dist/ (main/types
    # in packages/*/package.json), so lint, nest build and vitest all see
    # unresolved imports until they are compiled.
    - pnpm packages:build

cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store

lint:
  rules: !reference [.ci-rules, rules]
  stage: lint
  script:
    - pnpm lint

typecheck:
  rules: !reference [.ci-rules, rules]
  stage: typecheck
  script:
    - pnpm typecheck

test:unit:
  rules: !reference [.ci-rules, rules]
  stage: test
  # Phase 2's tenant-isolation tests run against a real Postgres (never
  # mocked — see docs/tenant-isolation.md), so this job needs a live
  # database service, unlike lint/typecheck/build which only need the
  # generated Prisma clients (codegen, no live connection required).
  # The rate-limit storage spec runs against a real Redis too.
  services:
    # Throwaway CI database: no fsync. Tenant provisioning (CREATE DATABASE
    # plus every tenant migration) is fsync-bound and stalled past its 60 s
    # hook timeout on the shared runner host.
    - &postgres-service
      name: postgres:18.6-alpine
      alias: postgres
      command:
        [
          'postgres',
          '-c',
          'fsync=off',
          '-c',
          'synchronous_commit=off',
          '-c',
          'full_page_writes=off',
        ]
    - &redis-service
      name: redis:8.10-alpine
      alias: redis
  variables:
    POSTGRES_USER: manar
    POSTGRES_PASSWORD: manar
    POSTGRES_DB: manar_control
    CONTROL_DATABASE_URL: postgresql://manar:manar@postgres:5432/manar_control
    TENANT_DB_BASE_URL: postgresql://manar:manar@postgres:5432/postgres
    REDIS_URL: redis://redis:6379
  script:
    - pnpm db:migrate:control:deploy
    - pnpm test

test:e2e:
  rules: !reference [.ci-rules, rules]
  stage: test
  # Phase 3's auth e2e suite (test/auth.e2e-spec.ts) provisions real
  # tenants — a real database via Postgres and a real Keycloak realm via
  # the Admin REST API — and validates tokens from a real Resource Owner
  # Password Credentials grant. Phase 4's agent-identity e2e suite
  # (test/agent-identity.e2e-spec.ts) additionally needs a real OpenBao —
  # it signs/revokes real certificates via the actual PKI secrets engine,
  # never mocked (see docs/agent-identity.md). Phase 5's
  # task-delegation e2e suite (test/task-delegation.e2e-spec.ts)
  # additionally needs a real OpenFGA — every authorization decision is
  # checked against a real running server, never mocked (see
  # docs/authorization-model.md) — so this job needs all four live
  # dependencies, mirroring how Phase 2/3/4 added Postgres/Keycloak/OpenBao.
  # Phase 7b's tool-gateway e2e suite (test/tool-gateway.e2e-spec.ts)
  # additionally exercises this same OpenBao instance's KV v2 engine
  # (OpenBaoSecretProvider — see docs/tool-gateway.md) and a minimal test
  # MCP server (docs/mcp.md) that runs in-process inside the test itself
  # (a plain node:http listener on an ephemeral port — no extra `services:`
  # entry needed, unlike OpenFGA below).
  #
  # OpenFGA itself is deliberately NOT a `services:` entry the way
  # Postgres/Keycloak/OpenBao are: GitLab CI's `services:` are plain Docker
  # containers with no way to run a one-shot "migrate" command before the
  # long-running "run" command starts (no `depends_on`/ordering support the
  # way deploy/docker-compose.yml has) — OpenFGA requires its schema
  # migrated before `openfga run` will serve traffic. Since this job's own
  # container also has no Docker available to sequence a second container
  # from a script step, the OpenFGA binary is downloaded and run directly
  # inside this job's own container instead (a single static Go binary —
  # no Docker needed), migrated then backgrounded, mirroring how
  # deploy/docker-compose.yml's openfga-migrate → openfga sequencing works,
  # just via shell steps instead of compose `depends_on`.
  #
  # The audit pipeline (Kafka, OpenSearch), the rate limiter and live feed
  # (Redis) and the approval workflows (Temporal, run in-job below like
  # OpenFGA) complete the deploy/docker-compose.yml stack the suite runs on.
  services:
    - *postgres-service
    - name: quay.io/keycloak/keycloak:26.7.1
      alias: keycloak
      command: ['start-dev']
    - name: openbao/openbao:2.6.1
      alias: openbao
      command: ['server', '-dev']
    - *redis-service
    # Single-node KRaft broker, as in deploy/docker-compose.yml but with one
    # listener: the job reaches it at kafka:9092. KAFKA_BROKERS is exported
    # in the script, not set as a job variable, because job variables are
    # passed to every service and this image turns any KAFKA_* variable
    # into a broker setting.
    - name: apache/kafka:4.3.1
      alias: kafka
      variables:
        KAFKA_NODE_ID: '1'
        KAFKA_PROCESS_ROLES: broker,controller
        KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
        KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
        KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
        KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
        KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
        KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
        KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
        KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
    - name: opensearchproject/opensearch:3.8.0
      alias: opensearch
      # discovery.type has a dot, which a CI variable name cannot carry;
      # the image's entrypoint passes -E flags through to OpenSearch.
      command: ['opensearch', '-Ediscovery.type=single-node']
      variables:
        DISABLE_SECURITY_PLUGIN: 'true'
        OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
  variables:
    # One network per job, so services resolve each other by alias the way
    # they do under Compose (Kafka advertises kafka:9092).
    FF_NETWORK_PER_BUILD: 'true'
    # Config the app refuses to boot without. CI-only placeholders, the
    # same kind as .env.example's dev values; nothing real is signed here.
    APPROVAL_GRANT_SIGNING_SECRET: ci-only-approval-grant-signing-secret
    PLATFORM_KILL_SWITCH_OPERATOR_TOKEN: ci-only-platform-kill-switch-operator-token
    MANAR_BFF_SERVICE_TOKEN: ci-only-manar-bff-service-token
    # demo-soc-tools and the specs' webhook receivers listen on loopback in
    # this job; .env.example sets the same for local dev. The app refuses
    # SSRF_ALLOW_LOOPBACK under NODE_ENV=production.
    SSRF_ALLOWED_HOSTS: 127.0.0.1,localhost
    SSRF_ALLOW_LOOPBACK: 'true'
    REDIS_URL: redis://redis:6379
    OPENSEARCH_NODE: http://opensearch:9200
    TEMPORAL_ADDRESS: 127.0.0.1:7233
    TEMPORAL_CLI_VERSION: 1.5.1
    ASTRAL_UV_VERSION: 0.11.33
    MANAR_AI_REF: 6088d9a280af4130479154a382044d8136909c17
    POSTGRES_USER: manar
    POSTGRES_PASSWORD: manar
    POSTGRES_DB: manar_control
    CONTROL_DATABASE_URL: postgresql://manar:manar@postgres:5432/manar_control
    TENANT_DB_BASE_URL: postgresql://manar:manar@postgres:5432/postgres
    # GitLab CI passes job-level variables through to linked services too,
    # so these configure the Keycloak service itself (see
    # deploy/docker-compose.yml's equivalent local-dev config).
    KC_BOOTSTRAP_ADMIN_USERNAME: admin
    KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    KC_HEALTH_ENABLED: 'true'
    # The service is reachable from this job's container at its alias
    # (`keycloak`) on its default internal HTTP port (8080) — no host port
    # mapping to remap, unlike deploy/docker-compose.yml's 8081. Tokens'
    # `iss` claims are stamped from this same base URL, so the app and the
    # test suite always resolve the same issuer.
    KEYCLOAK_BASE_URL: http://keycloak:8080
    KEYCLOAK_ADMIN_USERNAME: admin
    KEYCLOAK_ADMIN_PASSWORD: admin
    KEYCLOAK_ADMIN_CLIENT_ID: admin-cli
    KEYCLOAK_CLIENT_ID: manar-api
    # Configures the openbao service (same env vars as
    # deploy/docker-compose.yml's local dev instance) and the app/test
    # suite's own connection details to it.
    BAO_DEV_ROOT_TOKEN_ID: manar-dev-root-token
    BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    OPENBAO_ADDR: http://openbao:8200
    OPENBAO_TOKEN: manar-dev-root-token
    OPENBAO_PKI_ROOT_PATH: pki
    OPENBAO_PKI_INTERMEDIATE_PATH: pki_int
    OPENBAO_PKI_AGENT_ROLE: manar-agent
    # Phase 7b: KV v2 mount OpenBaoSecretProvider reads Tool.credentialReference
    # values from — see docs/tool-gateway.md. pnpm infra:openbao-init (run
    # below) enables this mount idempotently, same as the PKI engines above.
    OPENBAO_KV_MOUNT_PATH: secret
    AGENT_MTLS_PORT: '3443'
    AGENT_MTLS_SERVER_CERT_PATH: deploy/openbao/server-cert.pem
    AGENT_MTLS_SERVER_KEY_PATH: deploy/openbao/server-key.pem
    AGENT_MTLS_CLIENT_CA_PATH: deploy/openbao/ca-chain.pem
    AGENT_MTLS_CA_CHAIN_PATH: deploy/openbao/ca-chain.pem
    # OpenFGA runs directly inside this job's own container (see the
    # services: comment above) — reachable at localhost, unlike the other
    # three dependencies above which are separate `services:` containers
    # reached by alias.
    OPENFGA_API_URL: http://localhost:8080
    OPENFGA_STORE_NAME: manar
    OPENFGA_MODEL_FILE_PATH: src/authorization/model/manar.fga
    OPENFGA_DATASTORE_URI: postgres://manar:manar@postgres:5432/openfga?sslmode=disable
    OPENFGA_VERSION: v1.18.3
    # Phase 7a/7b integration pass
    # (test/tool-gateway-demo-integration.e2e-spec.ts): the real
    # packages/demo-soc-tools service, run directly in this job's own
    # container the same way OpenFGA is above (no Docker available here to
    # run its Dockerfile/deploy/docker-compose.yml service the way local
    # dev does) — a plain Node process on localhost, no host-port remap
    # needed since there's no port clash to avoid inside an isolated CI
    # job.
    DEMO_SOC_TOOLS_BASE_URL: http://localhost:3100
    DEMO_TOOLS_API_KEY: manar-dev-demo-tools-key
  script:
    - pnpm db:migrate:control:deploy
    # GitLab CI's `services:` don't support Docker healthchecks the way
    # deploy/docker-compose.yml's `keycloak`/`openbao` services do —
    # `start-dev` takes several seconds to become ready, so poll its
    # management-port health endpoint (see docs/human-auth.md) before
    # running tests against it. `node:24` ships bash; the image itself has
    # no curl/wget (same reasoning as deploy/docker-compose.yml's own
    # healthcheck).
    - >
      timeout 60 bash -c '
      until exec 3<>/dev/tcp/keycloak/9000 2>/dev/null &&
        echo -e "GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n" >&3 &&
        grep -q "\"status\": \"UP\"" <&3; do
        sleep 1;
      done'
    # OpenBao's own dev server has no separate health-check port; poll its
    # sys/health API directly with plain node (the openbao/openbao image
    # ships no curl/wget either, and node:24 always has fetch built in).
    - >
      timeout 60 bash -c '
      until node -e "fetch(process.env.OPENBAO_ADDR + \"/v1/sys/health\").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"; do
        sleep 1;
      done'
    - pnpm infra:openbao-init
    # Creates the `openfga` database on the shared Postgres server (see
    # deploy/docker-compose.yml's openfga-db-init service for the local-dev
    # equivalent) — using the `pg` package already installed by `pnpm
    # install` above rather than a `psql` CLI this image doesn't ship,
    # matching this file's established "no curl/wget/extra CLIs, use
    # node" convention.
    - >
      node -e "
      const { Client } = require('pg');
      const c = new Client({ connectionString: 'postgresql://manar:manar@postgres:5432/manar_control' });
      c.connect()
        .then(() => c.query('CREATE DATABASE openfga'))
        .then(() => c.end())
        .catch((e) => { console.error(e); process.exit(1); });
      "
    # Downloads the OpenFGA server as a single static binary (no Docker
    # needed — see the services: comment above), migrates its schema
    # against the database just created, then runs it in the background on
    # its default port (8080).
    - >
      node -e "
      fetch('https://github.com/openfga/openfga/releases/download/' + process.env.OPENFGA_VERSION + '/openfga_' + process.env.OPENFGA_VERSION.slice(1) + '_linux_amd64.tar.gz')
        .then((r) => r.arrayBuffer())
        .then((b) => require('fs').writeFileSync('openfga.tar.gz', Buffer.from(b)));
      "
    - tar xzf openfga.tar.gz openfga && chmod +x openfga
    - ./openfga migrate --datastore-engine postgres --datastore-uri "$OPENFGA_DATASTORE_URI"
    - ./openfga run --datastore-engine postgres --datastore-uri "$OPENFGA_DATASTORE_URI" &
    - >
      timeout 60 bash -c '
      until node -e "fetch(\"http://localhost:8080/healthz\").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"; do
        sleep 1;
      done'
    # Phase 7a/7b integration pass: build and run the real demo-soc-tools
    # service in the background (see the DEMO_SOC_TOOLS_BASE_URL/
    # DEMO_TOOLS_API_KEY variables above), then wait for its own health
    # endpoint before running the suite that depends on it.
    - pnpm --filter @manar/demo-soc-tools build
    - >
      PORT=3100 DEMO_TOOLS_API_KEY="$DEMO_TOOLS_API_KEY" node packages/demo-soc-tools/dist/main.js &
    - >
      timeout 30 bash -c '
      until node -e "fetch(\"$DEMO_SOC_TOOLS_BASE_URL/health/ready\").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"; do
        sleep 1;
      done'
    # Temporal: the CLI's single-binary dev server (in-memory, namespace
    # `default`), for the same reason OpenFGA runs in-job. The specs start
    # their own workers.
    - >
      node -e "
      fetch('https://github.com/temporalio/cli/releases/download/v' + process.env.TEMPORAL_CLI_VERSION + '/temporal_cli_' + process.env.TEMPORAL_CLI_VERSION + '_linux_amd64.tar.gz')
        .then((r) => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); })
        .then((b) => require('fs').writeFileSync('temporal.tar.gz', Buffer.from(b)));
      "
    - tar xzf temporal.tar.gz temporal && chmod +x temporal
    - ./temporal server start-dev --headless --ip 127.0.0.1 &
    - timeout 60 bash -c 'until ./temporal operator cluster health --address "$TEMPORAL_ADDRESS" >/dev/null 2>&1; do sleep 1; done'
    # manar-ai: ai-advisory.e2e-spec.ts runs its DLP scenarios against the
    # real service (no image is published), so run its gRPC server from
    # source at a pinned commit, outside the checkout and with a clean env
    # (the local settings deploy/docker-compose.yml gives it).
    - curl -fsSL -o /tmp/uv.tar.gz "https://github.com/astral-sh/uv/releases/download/$ASTRAL_UV_VERSION/uv-x86_64-unknown-linux-gnu.tar.gz"
    - curl -fsSL -o /tmp/manar-ai.tar.gz "$CI_SERVER_URL/api/v4/projects/manar%2Fmanar-ai/repository/archive.tar.gz?sha=$MANAR_AI_REF"
    - tar xzf /tmp/uv.tar.gz -C /usr/local/bin --strip-components=1
    - mkdir -p /tmp/manar-ai && tar xzf /tmp/manar-ai.tar.gz -C /tmp/manar-ai --strip-components=1
    - uv sync --project /tmp/manar-ai --locked --no-dev --quiet
    - >
      (cd /tmp/manar-ai && env -i PATH=/usr/local/bin:/usr/bin:/bin HOME="$HOME"
      PORT=8000 ENVIRONMENT=local LOG_LEVEL=INFO GRPC_PORT=50051 AI_PROVIDER=ollama
      OLLAMA_HOST=http://ollama-not-configured.invalid:11434 OLLAMA_TIMEOUT_SECONDS=5
      OLLAMA_MODEL=qwen3:8b EMBEDDING_MODEL=qwen3-embedding:0.6b
      .venv/bin/python -m app.grpc.server) &
    - timeout 60 bash -c 'until exec 3<>/dev/tcp/127.0.0.1/50051 2>/dev/null; do sleep 1; done'
    - export KAFKA_BROKERS=kafka:9092
    - timeout 90 bash -c 'until exec 3<>/dev/tcp/kafka/9092 2>/dev/null; do sleep 1; done'
    - timeout 90 bash -c 'until exec 3<>/dev/tcp/redis/6379 2>/dev/null; do sleep 1; done'
    - >
      timeout 120 bash -c '
      until node -e "fetch(process.env.OPENSEARCH_NODE + \"/_cluster/health\").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"; do
        sleep 2;
      done'
    - pnpm test:e2e

build:
  rules: !reference [.ci-rules, rules]
  stage: build
  script:
    - pnpm build
  artifacts:
    paths:
      - dist
    expire_in: 1 week

# ---------------------------------------------------------------------------
# Phase 12b: container/Kubernetes hardening & CI security scanning.
#
# Deferred all the way back in Phase 1 ("Security scanning stages are
# explicitly deferred... not stubbed with placeholders") — see
# docs/kubernetes.md for the full design (chart layout, NetworkPolicy
# graph, tool versions/rationale) and the severity thresholds each job
# below gates on. One tool per problem (Section 77): Trivy covers both
# dependency *and* container image scanning (no separate `npm audit`/
# Grype job), Gitleaks is the only secret scanner, Semgrep the only SAST
# tool, Syft the only SBOM generator, kubeconform + kube-linter are
# complementary (schema validity vs. best-practice/security lint), not
# redundant.
# ---------------------------------------------------------------------------

# Builds the three images this repo produces (the HTTP app, the Temporal
# worker — same Dockerfile, different target/CMD — and demo-soc-tools),
# saves each as a `docker save` tarball so later jobs (trivy-image,
# syft-sbom-image) can scan them without needing their own docker daemon.
# Runs in the `build` stage (after `build` above, before any `security`
# job that consumes its artifacts) — kept in this stage deliberately so
# stage ordering guarantees the tarballs exist before `security` starts;
# no existing stage was renamed/reordered/removed to add this.
docker:build-images:
  rules: !reference [.ci-rules, rules]
  # Non-Node image: skip default's corepack/pnpm before_script and cache.
  inherit:
    default: false
  stage: build
  image: docker:29
  services:
    - docker:29-dind
  variables:
    DOCKER_TLS_CERTDIR: '/certs'
  script:
    - docker build --build-arg MANAR_GIT_SHA=$CI_COMMIT_SHORT_SHA --target runtime -t manar-api:ci .
    - docker build --build-arg MANAR_GIT_SHA=$CI_COMMIT_SHORT_SHA --target worker -t manar-api-worker:ci .
    - docker build -t demo-soc-tools:ci -f packages/demo-soc-tools/Dockerfile .
    - docker save manar-api:ci -o manar-api.tar
    - docker save manar-api-worker:ci -o manar-api-worker.tar
    - docker save demo-soc-tools:ci -o demo-soc-tools.tar
  artifacts:
    paths:
      - manar-api.tar
      - manar-api-worker.tar
      - demo-soc-tools.tar
    expire_in: 1 day

# Secret scanning — full git history, not just the diff (matches the
# one-time retroactive check this phase ran manually: 101 commits, one
# confirmed-false-positive finding triaged into .gitleaks.toml's
# allowlist, see that file's comment). Threshold: fail on ANY finding not
# already allowlisted — there is no acceptable severity tier for a
# leaked credential.
gitleaks:
  rules: !reference [.ci-rules, rules]
  inherit:
    default: false
  stage: security
  image:
    name: ghcr.io/gitleaks/gitleaks:v8.30.1
    entrypoint: ['']
  script:
    - gitleaks git --log-opts="--all" -c .gitleaks.toml --exit-code 1 --redact -v .

# SAST. Threshold: fail only on ERROR-severity findings (Semgrep's own
# `auto` ruleset's highest tier — real, exploitable-pattern-shaped
# findings); WARNING/INFO findings are still reported in the full JSON
# artifact but don't block the pipeline, since the `auto` ruleset's lower
# tiers include a meaningful false-positive/style-opinion rate that would
# otherwise make this gate noisy enough to get disabled.
semgrep:
  rules: !reference [.ci-rules, rules]
  inherit:
    default: false
  stage: security
  image:
    name: semgrep/semgrep:1.172.0
    entrypoint: ['']
  variables:
    GIT_DEPTH: 0
  script:
    # Full report (every severity) — always produced, never fails the job.
    - semgrep scan --config auto --json --output semgrep-report.json . || true
    # Gate: ERROR severity only.
    - semgrep scan --config auto --severity ERROR --error .
  artifacts:
    when: always
    paths:
      - semgrep-report.json
    expire_in: 1 week

# Dependency scanning (pnpm-lock.yaml / node_modules) — not container
# image scanning, see trivy-image below for that. Threshold: fail on
# HIGH/CRITICAL only (matches trivy-image's threshold — one policy, not
# two different bars for the same tool).
trivy-fs:
  rules: !reference [.ci-rules, rules]
  inherit:
    default: false
  stage: security
  image:
    name: aquasec/trivy:0.71.0
    entrypoint: ['']
  script:
    - trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format table --ignore-unfixed .
    - trivy fs --scanners vuln --format json --output trivy-fs-report.json --ignore-unfixed .
  artifacts:
    when: always
    paths:
      - trivy-fs-report.json
    expire_in: 1 week

# Container image scanning — the three images docker:build-images just
# built. Threshold: fail on HIGH/CRITICAL only (LOW/MEDIUM are reported in
# the JSON artifact, not blocking — base images this small still carry a
# long tail of low-severity, often-unfixable-upstream findings that would
# make a zero-tolerance gate impossible to keep green).
trivy-image:
  rules: !reference [.ci-rules, rules]
  inherit:
    default: false
  stage: security
  image:
    name: aquasec/trivy:0.71.0
    entrypoint: ['']
  needs:
    - docker:build-images
  script:
    - >
      for img in manar-api manar-api-worker demo-soc-tools; do
        trivy image --input "${img}.tar" --severity HIGH,CRITICAL --exit-code 1 --format table --ignore-unfixed || FAILED=1;
        trivy image --input "${img}.tar" --format json --output "trivy-image-${img}.json" --ignore-unfixed;
      done;
      if [ -n "$FAILED" ]; then exit 1; fi
  artifacts:
    when: always
    paths:
      - trivy-image-*.json
    expire_in: 1 week

# SBOM generation (CycloneDX) for each of the three images — an artifact
# job, not a gate: never fails the pipeline on its own.
syft-sbom:
  rules: !reference [.ci-rules, rules]
  inherit:
    default: false
  stage: security
  image:
    name: anchore/syft:v1.51.0-debug
    entrypoint: ['']
  needs:
    - docker:build-images
  script:
    - >
      for img in manar-api manar-api-worker demo-soc-tools; do
        /syft "docker-archive:${img}.tar" -o "cyclonedx-json=sbom-${img}.json";
      done
  artifacts:
    paths:
      - sbom-*.json
    expire_in: 1 month

# Renders every Helm chart under deploy/helm/ (values only need an
# image.tag override — none of these charts assume a live cluster) so
# kubeconform/kube-linter below can validate the manifests this phase
# actually produced. Same Helm major version (v4) validated locally.
k8s-manifests:render:
  rules: !reference [.ci-rules, rules]
  inherit:
    default: false
  stage: security
  image:
    name: alpine/helm:4.2.3
    entrypoint: ['']
  script:
    - mkdir -p rendered
    - helm template manar-api deploy/helm/manar-api --set image.tag=ci > rendered/manar-api.yaml
    - helm template manar-api-worker deploy/helm/manar-api-worker --set image.tag=ci > rendered/manar-api-worker.yaml
    - helm template demo-soc-tools deploy/helm/demo-soc-tools --set image.tag=ci --set secrets.data.DEMO_TOOLS_API_KEY=ci-placeholder > rendered/demo-soc-tools.yaml
  artifacts:
    paths:
      - rendered/
    expire_in: 1 day

# Kubernetes manifest schema validation. Threshold: fail on ANY schema
# violation (-strict rejects unknown fields too) — there's no acceptable
# severity tier for "this isn't a valid Kubernetes object."
kubeconform:
  rules: !reference [.ci-rules, rules]
  inherit:
    default: false
  stage: security
  image:
    name: ghcr.io/yannh/kubeconform:v0.8.0-alpine
    entrypoint: ['']
  needs:
    - k8s-manifests:render
  script:
    - /kubeconform -strict -summary rendered/*.yaml

# Kubernetes best-practice/security lint (non-root, resource limits,
# anti-affinity, no `:latest`, ...) — complements kubeconform's schema
# check rather than duplicating it. Threshold: fail on any default-profile
# finding (kube-linter's own exit code convention — no custom
# .kube-linter.yaml config needed, the built-in default checks are what
# this chart set was written against and passes clean).
kube-linter:
  rules: !reference [.ci-rules, rules]
  inherit:
    default: false
  stage: security
  image:
    name: stackrox/kube-linter:v0.8.3-alpine
    entrypoint: ['']
  needs:
    - k8s-manifests:render
  script:
    - /kube-linter lint rendered/
