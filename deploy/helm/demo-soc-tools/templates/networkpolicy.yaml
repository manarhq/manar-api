{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "demo-soc-tools.fullname" . }}
  labels:
    {{- include "demo-soc-tools.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "demo-soc-tools.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: http
          protocol: TCP
      from:
        {{- range .Values.networkPolicy.callerPodSelectors }}
        - podSelector:
            matchLabels:
              {{- toYaml .labels | nindent 14 }}
        {{- end }}
  egress:
    # DNS only — no other dependency (see Chart.yaml description).
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dnsNamespaceSelector.labels | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dnsPodSelector.labels | nindent 14 }}
{{- end }}
