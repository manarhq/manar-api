apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "demo-soc-tools.fullname" . }}-test-connection"
  labels:
    {{- include "demo-soc-tools.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: wget
      image: busybox:1.37.0
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65534
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
      command: ['wget']
      args:
        [
          '-qO-',
          '{{ include "demo-soc-tools.fullname" . }}:{{ .Values.service.port }}/health/live',
        ]
  restartPolicy: Never
