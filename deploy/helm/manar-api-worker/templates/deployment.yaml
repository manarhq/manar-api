apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "manar-api-worker.fullname" . }}
  labels:
    {{- include "manar-api-worker.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "manar-api-worker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "manar-api-worker.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "manar-api-worker.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{/*
      Long enough for `Worker.shutdown()` to drain in-flight Temporal
      Activities and for the Nest DI container to close (releasing the
      per-tenant Prisma clients, the Kafka producer, and the Redis clients)
      before SIGKILL — see values.yaml. No preStop hook here, unlike the
      manar-api chart: this Deployment has no Service, so there is no
      endpoint-removal race to sleep through, and delaying SIGTERM would
      only delay the drain.
      */}}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "manar-api-worker.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "manar-api-worker.fullname" . }}-config
            - secretRef:
                name: {{ include "manar-api-worker.secretName" . }}
          {{- if or .Values.backingServiceTls.caSecretName .Values.aiAdvisoryTls.secretName .Values.extraEnv }}
          env:
            {{- if .Values.backingServiceTls.caSecretName }}
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/manar/backing-service-ca/{{ .Values.backingServiceTls.caKey }}
            {{- end }}
            {{- with .Values.aiAdvisoryTls }}
            {{- if .secretName }}
            # mTLS client for manar-ai (src/ai-advisory/ai-advisory.config.ts).
            - name: AI_ADVISORY_TLS_ENABLED
              value: 'true'
            - name: AI_ADVISORY_TLS_CA_FILE
              value: /etc/manar/ai-advisory-tls/{{ .caKey }}
            - name: AI_ADVISORY_TLS_CERT_FILE
              value: /etc/manar/ai-advisory-tls/{{ .certKey }}
            - name: AI_ADVISORY_TLS_KEY_FILE
              value: /etc/manar/ai-advisory-tls/{{ .keyKey }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: agent-mtls-certs
              mountPath: /app/deploy/openbao
              readOnly: true
            {{- with .Values.backingServiceTls.caSecretName }}
            - name: backing-service-ca
              mountPath: /etc/manar/backing-service-ca
              readOnly: true
            {{- end }}
            {{- with .Values.aiAdvisoryTls.secretName }}
            - name: ai-advisory-tls
              mountPath: /etc/manar/ai-advisory-tls
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: agent-mtls-certs
          secret:
            secretName: {{ include "manar-api-worker.agentMtlsCertsSecretName" . }}
        {{- with .Values.backingServiceTls.caSecretName }}
        - name: backing-service-ca
          secret:
            secretName: {{ . }}
        {{- end }}
        {{- with .Values.aiAdvisoryTls.secretName }}
        - name: ai-advisory-tls
          secret:
            secretName: {{ . }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        {{- if .Values.affinity }}
        {{- toYaml .Values.affinity | nindent 8 }}
        {{- else }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "manar-api-worker.selectorLabels" . | nindent 20 }}
        {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
