{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "manar-api-worker.secretName" . }}
  labels:
    {{- include "manar-api-worker.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
---
{{- if .Values.agentMtls.certs.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "manar-api-worker.agentMtlsCertsSecretName" . }}
  labels:
    {{- include "manar-api-worker.labels" . | nindent 4 }}
type: Opaque
stringData:
  server-cert.pem: {{ .Values.agentMtls.certs.serverCert | quote }}
  server-key.pem: {{ .Values.agentMtls.certs.serverKey | quote }}
  ca-chain.pem: {{ .Values.agentMtls.certs.caChain | quote }}
{{- end }}
