{{/*
One ingress rule: Prometheus scraping the metrics port. Nothing else
initiates a connection to this pod (see values.yaml's chart doc comment and
docs/kubernetes.md). Egress is scoped to what WorkerAppModule actually
calls at runtime, not the full structurally-required config surface.
*/}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "manar-api-worker.fullname" . }}
  labels:
    {{- include "manar-api-worker.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "manar-api-worker.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only Prometheus, on the metrics port (Temporal SDK exporter).
    - ports:
        - port: metrics
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.metrics.scraperNamespaceSelector.labels | nindent 14 }}
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dnsNamespaceSelector.labels | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.dnsPodSelector.labels | nindent 14 }}
    {{- range .Values.networkPolicy.egressTargets }}
    - ports:
        - port: {{ .port }}
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .name }}
    {{- end }}
{{- end }}
