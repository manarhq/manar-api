{{/*
Credentials/signing-secrets Secret. Only rendered when secrets.create is
true — set it to false and pre-create a Secret named secrets.name (or
accept the default "<fullname>-secrets") via an external secret manager
instead (see values.yaml's `secrets` doc comment). Never populate
`secrets.data` in a values file that gets committed to version control.
*/}}
{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "manar-api.secretName" . }}
  labels:
    {{- include "manar-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
---
{{/*
The agent mTLS listener's own TLS server cert/key + client-CA trust
anchor (see values.yaml's `agentMtls` doc comment and
src/agent-mtls/agent-mtls.config.ts). Mounted read-only, never baked into
the image.
*/}}
{{- if .Values.agentMtls.certs.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "manar-api.agentMtlsCertsSecretName" . }}
  labels:
    {{- include "manar-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  server-cert.pem: {{ .Values.agentMtls.certs.serverCert | quote }}
  server-key.pem: {{ .Values.agentMtls.certs.serverKey | quote }}
  ca-chain.pem: {{ .Values.agentMtls.certs.caChain | quote }}
{{- end }}
