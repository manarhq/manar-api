apiVersion: v1
kind: Service
metadata:
  name: {{ include "manar-api.fullname" . }}
  labels:
    {{- include "manar-api.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.httpPort }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.agentMtlsPort }}
      targetPort: agent-mtls
      protocol: TCP
      name: agent-mtls
    - port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "manar-api.selectorLabels" . | nindent 4 }}
