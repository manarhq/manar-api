# Local development infra for manar-api.
#
# Grows phase-by-phase as later phases need it (Kafka/Temporal/Redis/
# OpenSearch) — per YAGNI. Postgres was added in Phase 2 (Persistence &
# Tenancy); Keycloak is added in Phase 3 (Human Authentication) as the
# human identity provider (realm-per-tenant model — see docs/human-auth.md);
# OpenBao is added in Phase 4 (Agent Identity & Enrollment) as the PKI
# backend for agent workload identity — Manar owns CSR/enrollment policy,
# OpenBao only signs and revokes (see docs/agent-identity.md); OpenFGA is
# added in Phase 5 (Tasks, Delegation & OpenFGA) as the relationship-based
# authorization engine task grants are enforced against — see
# docs/authorization-model.md. Temporal is added in Phase 8 (Approval
# Engine) as the durable workflow engine `ApprovalWorkflow` runs on — see
# docs/approvals.md.
#
# Control DB and tenant DBs are separate *databases* on this one Postgres
# server for local dev — isolation is enforced by Postgres's database
# boundary, not by server separation. Production may split tenant DBs
# across separate server instances without changing the application-level
# contract (TenantDatabaseManager resolves a connection string per tenant;
# it doesn't assume same-server). OpenFGA's own `openfga` database (below)
# follows the same "nothing ephemeral" posture as the rest of this file —
# its Postgres storage engine, not the in-memory option, even for local
# dev.
#
# Kafka is added in Phase 9a (Tamper-Evident Audit Chain & Kafka Event
# Backbone) as the domain-event backbone every `AuditEvent`
# (`AuditService.record`) is also published to — see docs/audit-chain.md.
# KRaft mode (no ZooKeeper): Kafka 4.x has removed ZooKeeper support
# entirely (KIP-500/KIP-833), and the official `apache/kafka` image ships
# KRaft-only — running a deprecated ZooKeeper-backed topology here would be
# actively wrong, not merely old-fashioned.
services:
  postgres:
    image: postgres:18.6-alpine
    container_name: manar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: manar
      POSTGRES_PASSWORD: manar
      POSTGRES_DB: manar_control
    ports:
      # Host port 55432, not the default 5432: this machine already runs a
      # native PostgreSQL 17 service bound to 127.0.0.1:5432 outside Docker.
      - '55432:5432'
    volumes:
      # Postgres 18's image switched to storing data at /var/lib/postgresql
      # directly (pg_ctlcluster-style major-version subdirectories) instead
      # of the older /var/lib/postgresql/data convention.
      - manar-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U manar -d manar_control']
      interval: 5s
      timeout: 5s
      retries: 10

  # Human identity provider (Phase 3). One Keycloak realm per tenant —
  # realm/role/client provisioning happens via the Admin REST API from
  # TenantProvisioningService, not by hand. `start-dev` is Keycloak's
  # current documented local-development invocation (persistent storage,
  # relaxed hostname/TLS checks) — never used in production, where a real
  # `start` invocation with an explicit hostname and TLS termination is
  # required instead.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1
    container_name: manar-keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Health endpoints (used by the healthcheck below) live on the
      # management interface (port 9000 by default) since Keycloak 26 and
      # are disabled unless explicitly enabled.
      KC_HEALTH_ENABLED: 'true'
    ports:
      # Host port 8081, not the default 8080: keeps this consistent with
      # Postgres's non-default host port above and avoids clashing with
      # other local services that commonly bind 8080.
      - '8081:8080'
    volumes:
      - manar-keycloak-data:/opt/keycloak/data
    healthcheck:
      # The quay.io/keycloak/keycloak image ships no curl/wget; Keycloak's
      # own docs recommend a raw /dev/tcp bash redirection against the
      # management port's /health/ready endpoint instead.
      test:
        [
          'CMD-SHELL',
          'exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e "GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n" >&3 && cat <&3 | grep -q "\"status\": \"UP\""',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # PKI backend for Phase 4 (Agent Identity & Enrollment). `-dev` mode boots
  # an in-memory, auto-unsealed OpenBao server with no secrets engines
  # configured — unlike Postgres/Keycloak there is no automatic bootstrap
  # here: run `node deploy/openbao-init.mjs` once this container is healthy
  # to enable the PKI secrets engine, generate the root CA, generate and
  # sign an intermediate CA, mount it as the online issuer (root stays
  # unused for issuance — standard practice), and create the agent signing
  # role. See docs/agent-identity.md.
  openbao:
    image: openbao/openbao:2.6.1
    container_name: manar-openbao
    restart: unless-stopped
    # Required by OpenBao's own docs for the mlock() syscall it uses to
    # prevent secrets from being swapped to disk, even in -dev mode.
    cap_add:
      - IPC_LOCK
    environment:
      BAO_DEV_ROOT_TOKEN_ID: manar-dev-root-token
      BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      # Also read by the `bao` CLI the healthcheck below invokes inside the
      # container — without it, `bao status` defaults to https://127.0.0.1:8200.
      BAO_ADDR: http://127.0.0.1:8200
    command: ['server', '-dev']
    ports:
      # Default OpenBao/Vault port — unlike Postgres/Keycloak above, this one
      # isn't commonly bound by other local services, so no need to remap.
      - '8200:8200'
    healthcheck:
      # Unlike Keycloak's image, openbao/openbao ships its own `bao` CLI, so
      # no /dev/tcp workaround is needed — `bao status` exits 0 once the dev
      # server is up (dev mode auto-unseals on boot).
      test: ['CMD', 'bao', 'status']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Phase 5 (Tasks, Delegation & OpenFGA): a one-shot job that creates the
  # `openfga` database on the shared Postgres server before OpenFGA's own
  # `migrate` command runs against it. Postgres has no `CREATE DATABASE IF
  # NOT EXISTS` — this makes re-running `pnpm infra:up` against an
  # already-initialized volume safe (mirrors the idempotency guard
  # deploy/openbao-init.mjs uses for the same reason, just via SQL instead
  # of a Node script since this only needs one conditional statement).
  openfga-db-init:
    image: postgres:18.6-alpine
    container_name: manar-openfga-db-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: manar
    entrypoint: ['sh', '-c']
    command:
      - >
        psql -h postgres -U manar -d manar_control -tc
        "SELECT 1 FROM pg_database WHERE datname = 'openfga'" |
        grep -q 1 ||
        psql -h postgres -U manar -d manar_control -c "CREATE DATABASE openfga"

  # OpenFGA (https://openfga.org) requires its schema to be migrated before
  # `openfga run` will serve traffic — this is a separate, explicit command
  # (not run automatically by the server), mirroring the official
  # openfga/openfga docker-compose.yaml's own migrate-then-run sequencing.
  openfga-migrate:
    image: openfga/openfga:v1.18.3
    container_name: manar-openfga-migrate
    depends_on:
      openfga-db-init:
        condition: service_completed_successfully
    command:
      - migrate
      - --datastore-engine=postgres
      - --datastore-uri=postgres://manar:manar@postgres:5432/openfga?sslmode=disable

  # The relationship-based authorization engine Phase 5's AuthorizationService
  # calls (see docs/authorization-model.md). Postgres storage engine, not
  # the in-memory option, for the same "nothing ephemeral" reason every
  # other service in this file uses real storage. The playground/UI
  # (port 3000) is left enabled by the image's own default for local
  # inspection of the model/tuples during development — never reachable
  # outside this docker network in a real deployment.
  openfga:
    image: openfga/openfga:v1.18.3
    container_name: manar-openfga
    restart: unless-stopped
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://manar:manar@postgres:5432/openfga?sslmode=disable
      OPENFGA_PLAYGROUND_ENABLED: 'true'
    ports:
      # Default OpenFGA HTTP API port — nothing else local binds it.
      - '8080:8080'
      # Host port 8082, not the default 8081: Keycloak's own host port
      # (8081, see above) already claims it on this machine.
      - '8082:8081'
      # Playground UI (3000) is deliberately NOT published to the host —
      # this machine's port 3000 is already used by other local projects
      # (e.g. manar-web's dev server), and the playground isn't needed for
      # anything this phase's app code or tests do. It's still reachable
      # from inside the compose network if ever needed for manual
      # inspection (`docker compose exec` / a temporary port-forward).
    healthcheck:
      # The openfga/openfga image is a shell-less scratch-style image (no
      # /bin/sh at all, so a CMD-SHELL /dev/tcp probe like Keycloak's
      # healthcheck above can't run here) — but it bundles
      # `grpc_health_probe`, which the official openfga/openfga
      # docker-compose.yaml uses for exactly this reason, invoked directly
      # (CMD, not CMD-SHELL) against the gRPC health service.
      test: ['CMD', '/usr/local/bin/grpc_health_probe', '-addr=localhost:8081']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Phase 7a (Demo SOC Tool Backends): a standalone, deterministic-state
  # demo SIEM/EDR/IAM/Firewall HTTP API — genuinely mutates its own
  # in-memory state (isolate/release a host, disable a user, block/unblock
  # an IP, etc.), it just doesn't persist across restarts (`POST
  # /_demo/reset` restores seed state on demand). This is what Phase 7b's
  # tool gateway proxies real HTTP calls to; it has no dependency on and
  # no connection to Postgres/Keycloak/OpenBao/OpenFGA above. See
  # docs/superpowers/specs/2026-08-19-phase7a-demo-soc-tools-design.md.
  demo-soc-tools:
    build:
      # Context is the repo root, not this service's own directory — see
      # packages/demo-soc-tools/Dockerfile's header comment for why (this
      # package shares the root pnpm workspace's lockfile).
      context: ..
      dockerfile: packages/demo-soc-tools/Dockerfile
    container_name: manar-demo-soc-tools
    restart: unless-stopped
    environment:
      PORT: 3100
      NODE_ENV: production
      LOG_LEVEL: info
      # Static bearer token this service authenticates with — Phase 7b's
      # CredentialBrokerService is meant to fetch the real value from
      # OpenBao and inject it, not read it from here; this default only
      # exists so `docker compose up` works out of the box for local/demo
      # use, same posture as Keycloak/OpenBao's dev credentials above.
      DEMO_TOOLS_API_KEY: manar-dev-demo-tools-key
    ports:
      # Host port 3101, not 3100: 3100 is a common local dev-server port
      # other projects on this machine bind outside Docker — same "avoid a
      # clash with something already running locally" reasoning as
      # Postgres/Keycloak's non-default host ports above. The container's
      # own PORT stays 3100 (see `environment` above); only the host-side
      # mapping changes.
      - '3101:3100'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3100/health/live',res=>{process.exit(res.statusCode===200?0:1)}).on('error',()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # Phase 8 (Approval Engine): Temporal, the durable workflow engine
  # `ApprovalWorkflow` runs on — it waits (days, if need be) for a human
  # `decide` signal or its own timeout, entirely independent of this
  # process's own uptime. `temporalio/auto-setup`'s own entrypoint creates
  # its `temporal`/`temporal_visibility` databases itself (via
  # `temporal-sql-tool create`, against `POSTGRES_USER`, which — like every
  # other service in this file — has full privileges on the shared Postgres
  # server) the first time it boots, so unlike OpenFGA above there is no
  # separate db-init job needed here. "postgres12" is the correct
  # `DB` driver value for any Postgres major version >= 12 per Temporal's
  # own docs — it is not tied to literally running Postgres 12 (this file
  # runs Postgres 18).
  temporal:
    image: temporalio/auto-setup:1.29.0
    container_name: manar-temporal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: manar
      POSTGRES_PWD: manar
      POSTGRES_SEEDS: postgres
    ports:
      # Default Temporal frontend gRPC port — nothing else local binds it.
      - '7233:7233'
    healthcheck:
      # temporalio/auto-setup binds its own gRPC listener to the
      # container's own IP, not loopback — `--address localhost:7233`
      # fails for that reason (a known quirk of this image, not a
      # misconfiguration here); `$$(hostname -i)` (escaped so docker
      # compose doesn't try to interpolate it itself) is the documented
      # workaround.
      test:
        [
          'CMD-SHELL',
          'temporal operator cluster health --address $$(hostname -i):7233',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  # Temporal Web UI — local inspection only (workflow history, pending
  # signals, retried Activities); never required by any app code or test.
  # Host port 8083, not the image's own default 8080: OpenFGA's HTTP API
  # already claims 8080 on this machine (see that service above).
  temporal-ui:
    image: temporalio/ui:2.36.0
    container_name: manar-temporal-ui
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - '8083:8080'

  # Phase 9a (Tamper-Evident Audit Chain & Kafka Event Backbone): a
  # single-node, combined broker+controller KRaft cluster — the current
  # (Kafka 4.x, no ZooKeeper) recommended topology for a single local-dev
  # broker per the official Apache Kafka documentation. `apache/kafka` is
  # the official ASF-maintained image (as opposed to a third-party
  # Confluent/Bitnami build) — nothing here needs any of those distros'
  # extra tooling. `manar.audit-events` is the one topic every
  # `AuditService.record` call publishes its envelope to (see
  # docs/audit-chain.md) — `KafkaPublisherService` creates it automatically
  # on first connect (the same "resolve-or-create, no separate init job"
  # posture `OpenFgaClientService.onModuleInit` already establishes), so no
  # topic-creation step is needed here.
  #
  # Two listeners, same "internal vs. host-mapped" split Postgres/Keycloak/
  # OpenFGA above don't need (they're only ever reached by this repo's own
  # Node processes, which always run on the host, never inside this compose
  # network) but Kafka's own advertised-listener contract requires
  # explicitly: `PLAINTEXT` (`kafka:9092`) is what a client *inside* the
  # compose network would use; `PLAINTEXT_HOST` (`localhost:29092`, host
  # port 29092 — not Kafka's own default 9092, kept clear of anything else
  # locally bound to it) is what every actual client in this repo uses
  # (`manar-api`'s own HTTP/worker processes and every test suite all run
  # on the host, never inside Docker).
  kafka:
    image: apache/kafka:4.3.1
    container_name: manar-kafka
    restart: unless-stopped
    ports:
      - '29092:29092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # A single-broker, single-controller cluster has nothing to replicate
      # across — 1 is the only value that makes sense for any of these
      # three, and is required (the image's own defaults assume a
      # multi-broker cluster and refuse to start otherwise).
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # No KAFKA_KRAFT_CLUSTER_ID set — the image generates and persists one
      # itself on first boot for a single-node cluster; only a genuine
      # multi-node cluster needs one generated and shared explicitly ahead
      # of time.
    volumes:
      - manar-kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      # apache/kafka is a full JVM image with its own bin/ scripts on PATH
      # (KAFKA_HOME=/opt/kafka) — no /dev/tcp workaround needed, unlike
      # Keycloak's shell-but-no-curl image above.
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # Phase 9b (OpenSearch Indexing, OCSF, Live SSE, Evidence Export &
  # Retention): SSE fanout backbone. `AuditIndexerService` (the same Kafka
  # consumer that indexes every `AuditEvent` into OpenSearch below)
  # publishes each event to a per-tenant Redis pub/sub channel
  # (`manar:audit-live:<tenantId>`) — `GET /events/live` subscribes to that
  # channel for the lifetime of one SSE connection, so a live event reaches
  # every connected dashboard client regardless of which API replica
  # originally recorded it. The official `redis` Docker Hub image (Redis
  # 8.x, "docker.io/library/redis") — nothing here needs Sentinel/Cluster
  # mode, a single instance is enough for local dev and for this MVP's
  # fanout-only usage (no persistence requirement: a dashboard reconnecting
  # after a dropped SSE connection just resumes seeing new events, it never
  # needs to replay ones it missed — Postgres/OpenSearch remain the durable
  # record). No password/ACL configured (`protected-mode` stays off) — the
  # same "no auth needed for local-only infra" posture OpenFGA/Temporal
  # already take in this file; nothing outside this repo's own processes
  # ever reaches this port.
  redis:
    image: redis:8.10-alpine
    container_name: manar-redis
    restart: unless-stopped
    ports:
      # Default Redis port — nothing else local binds it.
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # Phase 9b: the search/indexing backbone `AuditIndexerService` upserts
  # every `manar.audit-events` Kafka message into (keyed by `eventId`, so
  # Kafka's at-least-once redelivery never double-indexes — Section 29).
  # Postgres remains authoritative (`pnpm manar audit:reindex` fully
  # reconstructs this index from Postgres alone — see docs/audit-chain.md);
  # OpenSearch here is a queryable projection, never a second source of
  # truth. `opensearchproject/opensearch` is the official OpenSearch
  # Project image. `discovery.type=single-node` is OpenSearch's own
  # documented single-container local-dev mode (no cluster
  # formation/quorum needed). `DISABLE_SECURITY_PLUGIN=true` turns off the
  # security plugin's TLS/auth demands entirely (OpenSearch 2.12+ otherwise
  # refuses to start without a custom strong admin password) — the same
  # "no auth needed for local-only infra nothing outside this repo's own
  # processes ever reaches" posture `redis` above and OpenFGA/Temporal
  # elsewhere in this file already take; never appropriate for a real
  # deployment, which must re-enable the security plugin and configure
  # real credentials/TLS instead. `bootstrap.memory_lock=true` (with the
  # matching `memlock` ulimit) is OpenSearch's own documented recommendation
  # to prevent the JVM heap from being swapped to disk; `OPENSEARCH_JAVA_OPTS`
  # caps the heap at 512m, comfortably enough for local dev/test volumes
  # without assuming a large host.
  opensearch:
    image: opensearchproject/opensearch:3.8.0
    container_name: manar-opensearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: 'true'
      bootstrap.memory_lock: 'true'
      OPENSEARCH_JAVA_OPTS: '-Xms512m -Xmx512m'
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      # Default OpenSearch REST API port — nothing else local binds it.
      - '9200:9200'
    volumes:
      - manar-opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -s http://127.0.0.1:9200/_cluster/health >/dev/null 2>&1',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Phase 10b (AI Advisory Pipeline Integration): manar-ai's real gRPC
  # `AnalysisService` (Phase 10a, a separate repo — `../manar-ai`, a
  # sibling checkout of this one) — the only thing `AiAdvisoryClient`
  # (src/ai-advisory/) ever calls. Plaintext this phase, matching manar-ai's
  # own deliberate Phase 10a scope call (mTLS deferred — see
  # docs/ai-security-model.md). Runs `python -m app.grpc.server` (the gRPC
  # service), not the image's own default CMD (`uvicorn app.main:app`,
  # manar-ai's separate REST *debug* interface — not what `manar-api`
  # depends on).
  #
  # AI_PROVIDER=ollama, OLLAMA_HOST defaulting to a deliberately
  # unresolvable `.invalid` host: this container's own gRPC layer,
  # deterministic DLP pattern-matching layer (`app/dlp/patterns.py`,
  # unconditional, no LLM dependency — Section 73), and documented
  # fail-secure envelopes (manar-ai's docs/ai-security-model.md's "Fail
  # loudly, never fail open or fail silent") are all real and exercised
  # end-to-end by this service with zero setup. A DNS-unresolvable
  # `.invalid` hostname (RFC 2606) makes manar-ai's own internal provider
  # calls fail *fast* (immediate resolution failure, not a slow timeout),
  # so `AnalyzeDlp`/`AnalyzeRisk`/`AnalyzePromptInjection` all still return
  # promptly with manar-ai's own real fail-secure envelopes. Content-
  # dependent AI-signal test scenarios (a genuine high-confidence risk
  # score, a genuine prompt-injection detection) use a small local
  # contract-conformant test double instead — see
  # test/ai-advisory.e2e-spec.ts's own doc comment for the full rationale.
  #
  # `OLLAMA_HOST`/`OLLAMA_TIMEOUT_SECONDS` are read from this shell's own
  # environment (docker compose variable substitution, not the container's
  # runtime env), defaulting to the values above when unset — so plain
  # `pnpm infra:up` is byte-for-byte identical to before this comment was
  # written: a DNS-unresolvable host and a short 5s per-call timeout,
  # neither of which the fail-secure path even depends on (DNS resolution
  # fails immediately regardless of the timeout value). `pnpm infra:up:ai`
  # (below) overrides both to point at the real `ollama` service defined
  # below it, with a timeout long enough for a real qwen3:8b generation
  # call. `OLLAMA_MODEL`/`EMBEDDING_MODEL` are pinned explicitly rather
  # than left to manar-ai's own Python-side defaults (which currently
  # happen to match) so this file stays the single source of truth for
  # exactly which tags `infra:up:ai` pulls below — manar-ai's chat model
  # comes from `OLLAMA_MODEL`; embeddings always come from `EMBEDDING_MODEL`
  # and are always Ollama-backed regardless of `AI_PROVIDER` (Section 44:
  # "local embeddings by default"). Both must be reachable at the same
  # `OLLAMA_HOST`.
  #
  # `AI_ADVISORY_PROVIDER` (manar-api's own side of this — see
  # src/ai-advisory/ai-advisory.config.ts's doc comment, and this repo's
  # own .env.example) must be kept in sync with `AI_PROVIDER` here by
  # hand: there is no RPC for manar-api to introspect manar-ai's actual
  # provider. Both currently default to `ollama`.
  manar-ai:
    build:
      context: ../../manar-ai
    container_name: manar-ai
    restart: unless-stopped
    command: ['python', '-m', 'app.grpc.server']
    environment:
      PORT: 8000
      ENVIRONMENT: local
      LOG_LEVEL: INFO
      GRPC_PORT: 50051
      AI_PROVIDER: ollama
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama-not-configured.invalid:11434}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-5}
      OLLAMA_MODEL: qwen3:8b
      EMBEDDING_MODEL: qwen3-embedding:0.6b
    ports:
      # Matches AiAdvisoryConfigSchema's AI_ADVISORY_GRPC_TARGET default
      # (localhost:50051) — every process that reads that config runs on
      # the host, never inside this compose network.
      - '50051:50051'
    healthcheck:
      # No standard gRPC health-checking protocol is registered by
      # app/grpc/server.py (out of scope for manar-ai's Phase 10a) and this
      # image ships no curl/wget/grpc_health_probe — a plain TCP connect via
      # the Python already on PATH (python:3.13-slim base image) is enough
      # to confirm the gRPC listener itself is up, mirroring
      # packages/demo-soc-tools's own "no curl in the image, write a small
      # inline probe instead" precedent above.
      test:
        [
          'CMD',
          'python',
          '-c',
          "import socket; socket.create_connection(('127.0.0.1', 50051), 2).close()",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Opt-in real model backend for manar-ai, added by Task 2 of
  # docs/superpowers/sdd/plan-mvp-unblock so Task 1's hot/longform lane
  # split (src/ai-advisory/ai-advisory-client.service.ts) has something
  # genuine to observe — without this service, `manar-ai` above always
  # runs against the unresolvable `.invalid` host and only ever exercises
  # its fail-secure path (see that service's own doc comment). Behind
  # `profiles: ['ai']` so it is never started by plain `pnpm infra:up`/
  # `docker compose up` — only `docker compose --profile ai up` (or the
  # `pnpm infra:up:ai` script below, in package.json) brings it up. Not
  # depended on by `manar-ai` (`depends_on` would force `manar-ai` to also
  # require the `ai` profile, breaking the default no-profile stack) — the
  # two are wired together purely via the `OLLAMA_HOST` environment
  # substitution on `manar-ai` above, which `pnpm infra:up:ai` sets.
  #
  # Official `ollama/ollama` image. No GPU passthrough configured for this
  # host's Docker daemon (checked: `docker run --gpus all` fails with "no
  # known GPU vendor found" — the nvidia-container-toolkit isn't wired up
  # here, unlike the host's own native `ollama` systemd service, which does
  # use the GPU) — this container runs CPU inference, which is
  # considerably slower. See docs/demo.md's AI profile section for
  # pre-warming guidance before a live demo.
  ollama:
    image: ollama/ollama:latest
    container_name: manar-ollama
    restart: unless-stopped
    profiles: ['ai']
    ports:
      # Host port 11435, not Ollama's own default 11434: this machine
      # already runs a native `ollama` systemd service bound to 11434
      # outside Docker (same "avoid a clash with something already running
      # locally" reasoning as Postgres/Keycloak's non-default host ports
      # above). The container's own listener stays on its default 11434;
      # only the host-side mapping changes. `manar-ai` never uses this
      # host-mapped port — it reaches this service over the compose
      # network at `ollama:11434` (see `OLLAMA_HOST` above).
      - '11435:11434'
    volumes:
      - manar-ollama-data:/root/.ollama
    healthcheck:
      test: ['CMD-SHELL', 'ollama list >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  manar-postgres-data:
  manar-keycloak-data:
  manar-kafka-data:
  manar-opensearch-data:
  manar-ollama-data:
