# Phase 4 (Agent Identity & Enrollment): the TypeScript agent SDK
# (packages/sdk-node) is kept in this repo's pnpm workspace rather than a
# fourth git repo — it's tightly coupled to manar-api's enrollment API
# surface, and there's no concrete technical requirement for a separate
# repo yet. See docs/agent-identity.md.
#
# Phase 7a (Demo SOC Tool Backends): packages/demo-soc-tools joins the
# same 'packages/*' glob below — a standalone Fastify service (own
# package.json/tsconfig/Dockerfile), not coupled to manar-api's own app
# code, kept here for the same "no separate repo needed yet" reason. See
# docs/superpowers/specs/2026-08-19-phase7a-demo-soc-tools-design.md.
packages:
  - 'packages/*'

# Phase 12a (App Hardening & Webhooks): @fastify/helmet's own fastify
# peer dependency would otherwise resolve to a separate, slightly older
# fastify version than this repo's own pin (^5.12.0), creating two
# structurally-incompatible `FastifyInstance` types in the dependency tree
# and breaking `app.register(helmet, ...)`'s type-check even though both
# versions are semver-compatible at runtime. Pinning the whole tree to one
# fastify resolution is the standard fix for this class of pnpm duplicate-
# peer-version issue.
overrides:
  fastify: ^5.12.2
  # Fixed HIGH/CRITICAL advisories (Trivy) in transitive dependencies whose
  # parents pin the vulnerable version: prisma 7.x (deepmerge-ts, mysql2),
  # @openfga/sdk (axios, follow-redirects), @nestjs/platform-express (multer,
  # body-parser), and the
  # tooling chain (brace-expansion, fast-uri, js-yaml, proxy-addr,
  # source-map-js). Drop each once its parent ships the fix.
  axios: ^1.20.0
  body-parser@2: ^2.4.0
  brace-expansion@5: ^5.0.11
  deepmerge-ts: ^8.0.0
  fast-uri@3: ^3.1.7
  fast-uri@4: ^4.1.4
  follow-redirects: ^1.16.2
  js-yaml@4: ^4.3.2
  multer: ^2.5.0
  mysql2: ^3.22.0
  proxy-addr: ^2.0.8
  source-map-js: ^1.2.2

allowBuilds:
  '@confluentinc/kafka-javascript': true
  '@prisma/engines': true
  # Pulled in transitively by swagger-ui-dist (@nestjs/swagger, Phase 11a
  # Part 1 — see docs/superpowers/specs/2026-08-19-phase11a-soc-ui-foundation-design.md).
  # Scarf's postinstall is anonymous download-analytics telemetry only, no
  # functional purpose for this repo — disabled rather than allowed.
  '@scarf/scarf': false
  '@swc/core': false
  prisma: true
  protobufjs: false
  unrs-resolver: false
minimumReleaseAgeExclude:
  - '@types/pg@8.23.1'
  - '@openfga/sdk@0.9.7'
